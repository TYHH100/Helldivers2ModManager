<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HD2 Mod Manager</title>
  <style>
    body { width: 340px; margin: 0; padding: 18px; box-sizing: border-box; font: 14px "Segoe UI", sans-serif; background: #191919; color: #fff; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    header img { width: 32px; height: 32px; }
    h1 { margin: 0; font-size: 17px; }
    section { display: grid; gap: 10px; margin: 16px 0; }
    label { color: #d0d0d0; }
    input, button { min-height: 34px; border-radius: 6px; border: 1px solid #555; padding: 6px 10px; box-sizing: border-box; }
    input { width: 100%; background: #282828; color: #fff; }
    button { background: #3b3b3b; color: #fff; cursor: pointer; }
    button.primary { background: #0f6cbd; border-color: #0f6cbd; }
    .toggle-row, .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .status { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .status-dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: #888; }
    .status-dot.connected { background: #6ccb5f; }
    .status-dot.disconnected { background: #f1707b; }
    .hint { color: #aaa; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><h1>HD2 Mod Manager connection</h1></header>
  <section>
    <label for="pairingCode">Pairing code</label>
    <input id="pairingCode" inputmode="numeric" maxlength="8" placeholder="8-digit code" autocomplete="one-time-code">
    <button id="pairButton" class="primary">Pair extension</button>
    <button id="unpairButton" hidden>Forget pairing</button>
    <div class="hint">Enable browser integration in the app, then generate a one-time code. Codes expire after five minutes.</div>
  </section>
  <section class="status-row">
    <div class="status"><span id="statusDot" class="status-dot"></span><span id="statusText">Checking…</span></div>
    <button id="refreshBtn">Refresh</button>
  </section>
  <section class="toggle-row">
    <label for="enabledToggle">Intercept Nexus downloads</label>
    <input id="enabledToggle" type="checkbox">
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
