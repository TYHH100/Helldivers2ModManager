<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    
    .header img {
      width: 32px;
      height: 32px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #b0b0b0;
    }
    
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .toggle-label {
      font-size: 14px;
    }
    
    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      background: #333;
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .toggle.active {
      background: #4CAF50;
    }
    
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    
    .toggle.active::after {
      transform: translateX(22px);
    }
    
    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #2a2a4a;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }
    
    .status-dot.connected {
      background: #4CAF50;
      animation: pulse 2s infinite;
    }
    
    .status-dot.disconnected {
      background: #f44336;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-text {
      font-size: 13px;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    .input-label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #b0b0b0;
    }
    
    .input-control {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    
    .input-control:focus {
      outline: none;
      border-color: #4CAF50;
    }
    
    .footer {
      padding-top: 12px;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    
    .refresh-btn {
      padding: 6px 12px;
      background: #3a3a5a;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .refresh-btn:hover {
      background: #4a4a6a;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="Icon">
    <h1>Nexus Download Interceptor</h1>
  </div>
  
  <div class="section">
    <div class="toggle-container">
      <span class="toggle-label">启用拦截</span>
      <div id="enabledToggle" class="toggle"></div>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">管理器状态</div>
    <div class="status-container">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText" class="status-text">检测中...</span>
      <button id="refreshBtn" class="refresh-btn">刷新</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">连接设置</div>
    <div class="input-group">
      <label class="input-label">服务器地址</label>
      <input type="text" id="serverHost" class="input-control" placeholder="localhost" value="localhost">
    </div>
    <div class="input-group">
      <label class="input-label">端口</label>
      <input type="number" id="serverPort" class="input-control" placeholder="74566" value="74566">
    </div>
  </div>
  
  <div class="footer">
    支持拦截 Nexus Mods 下载并发送到管理器
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
